<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #1e1f26; font-family: system-ui, sans-serif;
  }
  .calc {
    width: 320px; padding: 16px; background: #2a2c36; border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .display {
    background: #14151a; color: #fff; border-radius: 10px; padding: 12px 16px;
    text-align: right; margin-bottom: 14px; min-height: 84px;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .prev { color: #8a8d9a; font-size: 14px; min-height: 18px; }
  .curr { font-size: 36px; overflow-x: auto; white-space: nowrap; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  button {
    padding: 16px 0; font-size: 20px; border: 0; border-radius: 10px;
    background: #3b3e4c; color: #fff; cursor: pointer;
  }
  button:hover { filter: brightness(1.2); }
  button:active { transform: scale(.96); }
  .op { background: #f59e0b; }
  .fn { background: #5b5f73; }
  .eq { background: #22c55e; }
  .wide { grid-column: span 2; }
</style>
</head>
<body>
<div class="calc">
  <div class="display">
    <div class="prev" id="prev"></div>
    <div class="curr" id="curr">0</div>
  </div>
  <div class="keys">
    <button class="fn" data-a="clear">C</button>
    <button class="fn" data-a="back">⌫</button>
    <button class="fn" data-a="percent">%</button>
    <button class="op" data-op="/">÷</button>

    <button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button>
    <button class="op" data-op="*">×</button>

    <button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button>
    <button class="op" data-op="-">−</button>

    <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button>
    <button class="op" data-op="+">+</button>

    <button class="wide" data-n="0">0</button>
    <button data-n=".">.</button>
    <button class="eq" data-a="equals">=</button>
  </div>
</div>

<script>
  let curr = "0", prev = null, op = null, fresh = false;
  const $curr = document.getElementById("curr");
  const $prev = document.getElementById("prev");
  const sym = { "+": "+", "-": "−", "*": "×", "/": "÷" };

  function render() {
    $curr.textContent = curr;
    $prev.textContent = op ? `${prev} ${sym[op]}` : "";
  }

  function compute(a, b, o) {
    a = parseFloat(a); b = parseFloat(b);
    let r;
    if (o === "+") r = a + b;
    else if (o === "-") r = a - b;
    else if (o === "*") r = a * b;
    else if (o === "/") { if (b === 0) return "Error"; r = a / b; }
    return String(parseFloat(r.toPrecision(12)));
  }

  function number(n) {
    if (curr === "Error") curr = "0";
    if (fresh) { curr = "0"; fresh = false; }
    if (n === "." && curr.includes(".")) return;
    curr = (curr === "0" && n !== ".") ? n : curr + n;
    render();
  }

  function operator(o) {
    if (curr === "Error") return;
    if (op && !fresh) { curr = compute(prev, curr, op); }
    prev = curr; op = o; fresh = true;
    render();
  }

  function equals() {
    if (!op) return;
    curr = compute(prev, curr, op);
    op = null; prev = null; fresh = true;
    render();
  }

  function action(a) {
    if (a === "clear") { curr = "0"; prev = null; op = null; fresh = false; }
    else if (a === "back") {
      if (fresh || curr === "Error") curr = "0";
      else curr = curr.length > 1 ? curr.slice(0, -1) : "0";
    }
    else if (a === "percent" && curr !== "Error") curr = String(parseFloat(curr) / 100);
    else if (a === "equals") return equals();
    render();
  }

  document.querySelector(".keys").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.n !== undefined) number(b.dataset.n);
    else if (b.dataset.op) operator(b.dataset.op);
    else if (b.dataset.a) action(b.dataset.a);
  });

  document.addEventListener("keydown", e => {
    if (/^[0-9.]$/.test(e.key)) number(e.key);
    else if ("+-*/".includes(e.key)) operator(e.key);
    else if (e.key === "Enter" || e.key === "=") { e.preventDefault(); equals(); }
    else if (e.key === "Backspace") action("back");
    else if (e.key === "Escape" || e.key.toLowerCase() === "c") action("clear");
    else if (e.key === "%") action("percent");
  });
</script>
</body>
</html>
